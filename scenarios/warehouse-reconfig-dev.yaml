# M4 개발용: 환경 A + 수요 급증 + 재구성 가능한 공용 셀 (잠정). 모든 수치는 가상 값이다.
# 정책 기준값 조정은 이 시나리오와 개발 시드(0~9)로만 한다. 평가 격자는 EXP-002 에서 생성.
#
# 0~1200s: 1.5건/분 (A 와 같음)
# 1200~2400s: 3.0건/분 -> pack 예상 부하 30s x 3/분 = 1.5 셀 분량 > pack 셀 1개 (과부하 구간)
# 2400s~: 1.5건/분 으로 복귀
schema_version: "0.3"
scenario_id: warehouse-reconfig-dev
domain: warehouse_like
seed: 42
sim_time_limit: 3600
entities:
  - {id: cell-pick-1, type: workstation, capabilities: [pick], capacity: 1}
  - {id: cell-pick-2, type: workstation, capabilities: [pick], capacity: 1}
  - id: cell-flex-1
    type: workstation
    capabilities: [pick]
    capacity: 1
    reconfigurable: {options: [[pick], [pack]], changeover_s: 120}
  - {id: cell-pack-1, type: workstation, capabilities: [pack], capacity: 1}
relations:
  - {source: cell-pick-1, target: cell-pack-1, kind: material_flow}
  - {source: cell-pick-2, target: cell-pack-1, kind: material_flow}
  - {source: cell-flex-1, target: cell-pack-1, kind: material_flow}
workload:
  arrival_process:
    type: piecewise_poisson
    segments:
      - {start_s: 0, rate_per_min: 1.5}
      - {start_s: 1200, rate_per_min: 3.0}
      - {start_s: 2400, rate_per_min: 1.5}
  job_template:
    - capability: pick
      service_time: {type: exponential, mean_s: 60}
    - capability: pack
      service_time: {type: uniform, low_s: 20, high_s: 40}
constraints:
  - {id: nonnegative-capacity, kind: invariant}
  - {id: precedence, kind: invariant}
objectives:
  - {id: meet-order-deadline, kind: provisional}
