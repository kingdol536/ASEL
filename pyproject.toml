[project]
name = "asel"
version = "0.1.0"
description = "Adaptive System Evolution Lab - logical simulation core"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
asel = "asel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
